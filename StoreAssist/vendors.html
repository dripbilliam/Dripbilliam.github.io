<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Gnomes Shopkeeping - Vendors</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Vendors / Crafters</h1>
      <p>Manage sources and locations</p>
    </header>

    <nav class="top-nav" aria-label="StoreAssist Sections">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="spells.html">Spells</a>
      <a class="nav-link" href="craft.html">Craft Queue</a>
      <a class="nav-link" href="inventory.html">Inventory</a>
      <a class="nav-link active" href="vendors.html">Vendors</a>
      <a class="nav-link" href="orders.html">Special Orders</a>
      <a class="nav-link" href="settings.html">Settings</a>
    </nav>

    <main>
      <div class="panel-head">
        <h2>Vendors</h2>
        <div class="toolbar">
          <button id="addVendorBtn">Add Vendor</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Contact</th>
              <th>Notes</th>
              <th>Active</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="vendorRows"></tbody>
        </table>
      </div>

      <div class="panel-head top-gap">
        <h2>Locations</h2>
        <div class="toolbar">
          <button id="addLocationBtn" class="secondary">Add Location</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Location</th><th>Actions</th></tr></thead>
          <tbody id="locationRows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="js/vendors-page.js"></script>
</body>
</html>
